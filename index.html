<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Bro">
<meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Gym Bro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0F12;--card:#1A1C21;--ctl:#262930;--line:#3A3E47;--tx:#F2F3F5;--tx2:#9AA0AA;--lime:#C6F432;--limeTx:#C6F432;--onLime:#0E0F12;--orange:#FF9F6B;--sec:#1A1C21;--hold:rgba(14,15,18,.22)}
@media (prefers-color-scheme: light){:root{--bg:#F4F5F7;--card:#FFFFFF;--ctl:#E4E6EA;--line:#D5D8DE;--tx:#0E0F12;--tx2:#5C626C;--limeTx:#4F6B00;--orange:#B4470F;--sec:#E4E6EA}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif;font-weight:500;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;-webkit-touch-callout:none}
input[type=text]{-webkit-user-select:text;user-select:text}
#app{height:100vh;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:24px;padding:calc(env(safe-area-inset-top) + 8px) 20px calc(env(safe-area-inset-bottom) + 16px)}
.top{height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700}
.prog{height:48px;flex-shrink:0;display:flex;flex-direction:column;justify-content:center;gap:10px}
.prog .row{display:flex;justify-content:space-between;font-size:15px}
.prog .row b{font-weight:600}.prog .row span{color:var(--tx2)}
.bar{height:10px;border-radius:5px;background:var(--ctl);overflow:hidden}
.bar>div{height:100%;background:var(--lime);border-radius:5px;transition:width .3s}
.head{flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.label{height:32px;display:flex;justify-content:space-between;align-items:center}
.label>span{font-size:17px;color:var(--tx2)}
.title{margin:0;font-family:'Space Grotesk',sans-serif;font-size:52px;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input.title{display:block;width:100%;background:transparent;border:0;padding:0;outline:none;border-radius:0}
.content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;margin:0 -20px;padding:0 20px}
.pill{flex-shrink:0;width:100%;height:76px;border-radius:38px;border:0;background:var(--lime);color:var(--onLime);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.pill.sec{background:var(--sec);color:var(--tx)}
.pill .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--hold);pointer-events:none}
.pill.holding .fill{width:100%;transition:width .9s linear}
.pill span{position:relative}
.tiles{display:grid;gap:10px;flex-shrink:0}
.tile{background:var(--card);border-radius:24px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.big{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;white-space:nowrap}
.small{font-size:14px;color:var(--tx2)}
.sect{font-size:15px;color:var(--tx2);padding-top:12px;flex-shrink:0}
.row64{flex-shrink:0;width:100%;background:var(--card);border:0;border-radius:24px;min-height:64px;padding:0 20px 0 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;font-size:20px;font-weight:700}
.row64 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:15px;font-weight:500;color:var(--tx2);white-space:nowrap}
.tag{font-size:14px;font-weight:600;border:2px solid currentColor;border-radius:14px;padding:6px 10px;white-space:nowrap;align-self:flex-start}
.tag.up{color:var(--limeTx)}.tag.down{color:var(--orange)}
.card{flex-shrink:0;background:var(--card);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.icons{display:flex;gap:8px}
.icon{width:48px;height:48px;border-radius:24px;border:0;background:var(--card);color:var(--tx2);display:flex;align-items:center;justify-content:center}
.mini{height:32px;padding:0 14px;border-radius:16px;border:0;background:var(--card);color:var(--tx2);font-size:14px;font-weight:600}
.back{height:48px;padding:0;border:0;background:none;color:var(--limeTx);font-size:17px;font-weight:600}
.lr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lr label,.lr .lab{font-size:16px;color:var(--tx2)}
.val{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;line-height:1;white-space:nowrap}
.val small{font-size:20px;color:var(--tx2)}
.adj{display:flex;align-items:center;gap:6px}
.sq{width:44px;height:44px;border-radius:22px;border:0;background:var(--ctl);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:56px;margin:0;padding:0 4px;border-radius:28px;background:var(--ctl);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:48px;height:48px;border-radius:24px;background:var(--lime);border:0;box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:48px;height:48px;border-radius:24px;background:var(--lime);border:0}
.stops{display:grid;text-align:center;font-size:15px;color:var(--tx2)}
.stops .on{color:var(--tx);font-weight:700}
.note{font-size:14px;font-weight:600;min-height:18px}
.note.up{color:var(--limeTx)}.note.down{color:var(--orange)}
.ringwrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:8px}
.ring{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring svg{position:absolute;inset:0}
.ring .t{position:relative;font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:700}
.next{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.next b{font-size:22px;font-weight:700}
.sets{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--ctl);padding-top:14px}
.sets div{display:flex;justify-content:space-between;gap:12px;font-size:16px;font-weight:600}
.sets span{font-weight:500;color:var(--tx2);text-align:right}
.ctl{background:var(--ctl);border-radius:16px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.ctl .small{font-size:13px}
.stepper{display:flex;justify-content:space-between;align-items:center}
.stepper button{width:40px;height:40px;border:0;background:transparent;color:var(--limeTx);font-size:24px;font-weight:700}
.stepper b{font-size:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.exname{flex:1;min-width:0;background:transparent;border:0;outline:none;padding:0;font-size:20px;font-weight:700}
.toggle{height:40px;border-radius:20px;border:0;background:var(--line);font-size:15px;font-weight:700}
.toggle.on{background:var(--lime);color:var(--onLime)}
.rowx{flex-shrink:0;display:flex;gap:8px;align-items:stretch}
.rowx .row64{flex:1;min-width:0}
.empty{color:var(--tx2);font-size:16px}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<main id="app"></main>
<script src="app.js"></script>
</body>
</html>
